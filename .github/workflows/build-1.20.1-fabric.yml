name: build-1.20.1-fabric

on:
  workflow_dispatch:
  push:
    branches: [multiversion]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Loom Cache
        uses: actions/cache@v4
        with:
          path: "**/.gradle/loom-cache"
          key: "${{ runner.os }}-gradle-${{ hashFiles('**/libs.versions.*', '**/*.gradle*', '**/gradle-wrapper.properties') }}"
          restore-keys: "${{ runner.os }}-gradle-"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: never

      - name: Gradle build
        run: ./gradlew -I init.gradle build

      - name: List built jars
        run: find versions/1.20.1-fabric/build/libs -type f

      - name: Upload 1.20.1-fabric jars
        uses: actions/upload-artifact@v4
        with:
          name: voxy-1.20.1-fabric
          path: versions/1.20.1-fabric/build/libs/
